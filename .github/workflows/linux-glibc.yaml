name: build-linux-glibc

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false

      matrix:
        include:
          - artifact: linux-x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - artifact: linux-arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm64

    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-02
          targets: ${{ matrix.target }}

      - name: Install Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.artifact }}

      - name: Build
        shell: bash
        env:
          CFLAGS: "-flto=full"
          CXXFLAGS: "-flto=full"
          RUSTFLAGS: "-Clinker-plugin-lto -Clto=fat -Clinker=clang -Clink-arg=-fuse-ld=lld"
        run: |
          cargo build \
            --release \
            --target ${{ matrix.target }}

      - name: Collect
        shell: bash
        run: |
          mkdir dist
          for bin in fitgirl-ddl fitgirl-ddl_gui; do
            cp "target/${{ matrix.target }}/release/${bin}" "dist/${bin}-${{ matrix.artifact }}"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
