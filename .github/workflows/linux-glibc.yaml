name: build-linux-glibc

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false

      matrix:
        include:
          - artifact: linux-x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - artifact: linux-arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm64

    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-02
          targets: ${{ matrix.target }}

      - name: Install Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.artifact }}

      - name: Install zig
        uses: mlugg/setup-zig@v2

      # zig for glibc baseline
      - name: Install zigbuild
        run: |
          ARCH=$(uname -m)

          echo "📦 Installing cargo-zigbuild for $ARCH..."

          # 下载并安装
          curl -LO "https://github.com/rust-cross/cargo-zigbuild/releases/latest/download/cargo-zigbuild-${ARCH}-unknown-linux-gnu.tar.xz"
          tar xf "cargo-zigbuild-${ARCH}-unknown-linux-gnu.tar.xz"
          mkdir -p ~/.cargo/bin
          mv "cargo-zigbuild-${ARCH}-unknown-linux-gnu/cargo-zigbuild" ~/.cargo/bin/
          rm -rf "cargo-zigbuild-${ARCH}-unknown-linux-gnu"*

          echo "✅ Installed to ~/.cargo/bin/cargo-zigbuild"

      - name: Build
        shell: bash
        env:
          CXXFLAGS: "-flto"
          RUSTFLAGS: "-Clink-arg=-flto"
        run: |
          cargo zigbuild \
            --release \
            --target ${{ matrix.target }}.2.31

      - name: Collect
        shell: bash
        run: |
          mkdir dist
          for bin in fitgirl-ddl fitgirl-ddl_gui; do
            cp "target/${{ matrix.target }}/release/${bin}" "dist/${bin}-${{ matrix.artifact }}"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
