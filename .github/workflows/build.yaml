name: publish-release

on:
  push:
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows-10:
    uses: ./.github/workflows/windows-10.yaml

  windows-11:
    uses: ./.github/workflows/windows-11.yaml

  macos:
    uses: ./.github/workflows/macos.yaml

  linux-glibc:
    uses: ./.github/workflows/linux-glibc.yaml

  release:
    needs:
      - windows-10
      - windows-11
      - macos
      - linux-glibc

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate release notes
        shell: python
        run: |
          import os

          tag = "${{ github.ref_name }}"
          repo = "${{ github.repository }}"

          FILES = {
              "CLI": [
                  "fitgirl-ddl-linux-x86_64",
                  "fitgirl-ddl-macos-arm64",
                  "fitgirl-ddl-macos-x86_64",
                  "fitgirl-ddl-win10-arm64.exe",
                  "fitgirl-ddl-win10-x86_64.exe",
                  "fitgirl-ddl-win11-arm64.exe",
                  "fitgirl-ddl-win11-x86_64.exe",
              ],
              "GUI": [
                  "fitgirl-ddl_gui-linux-x86_64",
                  "fitgirl-ddl_gui-macos-arm64",
                  "fitgirl-ddl_gui-macos-x86_64",
                  "fitgirl-ddl_gui-win10-arm64.exe",
                  "fitgirl-ddl_gui-win10-x86_64.exe",
                  "fitgirl-ddl_gui-win11-arm64.exe",
                  "fitgirl-ddl_gui-win11-x86_64.exe",
              ],
          }

          OS_MAP = {"linux": "Linux", "macos": "macOS", "win10": "Windows 10", "win11": "Windows 11"}

          def generate_table(prefix, label):
              row_x86 = {}
              row_arm = {}

              for fname in FILES[label]:
                  stem = fname.removeprefix(prefix + "-").removesuffix(".exe")
                  os_key, arch = stem.rsplit("-", 1)
                  col = OS_MAP[os_key]
                  url = f"https://github.com/{repo}/releases/download/{tag}/{fname}"
                  link = f"[Download]({url})"
                  if arch == "x86_64":
                      row_x86[col] = link
                  elif arch == "arm64":
                      row_arm[col] = link

              print(f"## {label}")
              print()
              print("| Architecture | Linux | macOS | Windows 10 | Windows 11 |")
              print("|--------------|-------|-------|------------|------------|")
              print(f"| x86_64 | {row_x86.get('Linux', '-')} | {row_x86.get('macOS', '-')} | {row_x86.get('Windows 10', '-')} | {row_x86.get('Windows 11', '-')} |")
              print(f"| arm64  | {row_arm.get('Linux', '-')} | {row_arm.get('macOS', '-')} | {row_arm.get('Windows 10', '-')} | {row_arm.get('Windows 11', '-')} |")
              print()

          from contextlib import redirect_stdout
          with open(os.environ["GITHUB_WORKSPACE"] + "-Release.md", "w") as f:
              with redirect_stdout(f):
                  generate_table("fitgirl-ddl", "CLI")
                  generate_table("fitgirl-ddl_gui", "GUI")

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/**/*
          body_path: ${{ github.workspace }}-Release.md
          prerelease: false
