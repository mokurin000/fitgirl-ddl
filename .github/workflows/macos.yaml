name: build-macos

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - artifact: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin

          - artifact: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin

    name: ${{ matrix.artifact }}

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-02
          targets: ${{ matrix.target }}
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.artifact }}

      - name: Build
        shell: bash
        run: |
          cargo build \
            --release \
            --features winio/objc-static \
            --target ${{ matrix.target }}

      - name: Collect
        shell: bash
        run: |
          mkdir dist
          for bin in fitgirl-ddl fitgirl-ddl_gui; do
            cp "target/${{ matrix.target }}/release/${bin}" "dist/${bin}-${{ matrix.artifact }}"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
